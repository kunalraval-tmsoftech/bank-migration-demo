name: Bank Migration CI/CD Pipeline

on:
  push:
    branches: [ development, uat, main ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test

  deploy-staging:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Deploy to Staging
        run: echo "Deploying to Staging..."

  migration:
    runs-on: ubuntu-latest
    needs: deploy-staging
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Run Migration
        run: node src/migration/migrate.js

  reconcile:
    runs-on: ubuntu-latest
    needs: migration
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Run Reconciliation
        run: node src/reconciliation/reconcile.js

  approval:
    runs-on: ubuntu-latest
    needs: reconcile
    steps:
      - name: Manual Approval Step
        run: echo "Waiting for approval..."

  production:
    runs-on: ubuntu-latest
    needs: approval
    steps:
      - name: Deploy to Production
        run: echo "Deploying to Production..."
